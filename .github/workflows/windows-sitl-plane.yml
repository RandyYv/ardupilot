name: windows-sitl-plane
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cygwin + deps
        shell: powershell
        run: |
          choco install -y cygwin
          $setup = "C:\tools\cygwin\cygwinsetup.exe"
          & $setup -q -P git,make,gcc-g++,python3,python3-pip,cmake,rsync

      - name: Build ArduPlane (SITL) with PLANE_SYSTEMID
        shell: C:\tools\cygwin\bin\bash.exe -lc {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git submodule update --init --recursive
          ./waf clean
          ./waf configure --board sitl --enable-PLANE_SYSTEMID
          ./waf plane -j4
          cp build/sitl/bin/arduplane.exe ArduPlane.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArduPlane.exe
          path: ArduPlane.exe
